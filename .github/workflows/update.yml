name: Update Taiwan outage data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC; Taiwan is UTC+8.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-outage-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional spreadsheet parsers
        run: python -m pip install --disable-pip-version-check openpyxl xlrd

      - name: Fetch and normalize official data
        run: python scripts/update_data.py

      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outages.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update outage data"
            git push
          fi
